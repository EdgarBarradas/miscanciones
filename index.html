<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mis canciones</title>
  <link rel="stylesheet" href="style.css">	
</head>
<body>
  <h1>Buscador de Canciones</h1>
    <label>Notación:</label>
	
  <select id="notacion">
 	<option value="Inglesa">Inglesa</option>
	<option value="Latina" selected>Latina</option>
  </select><br>
	
  <!-- Filtros -->
  <label>Idioma:</label>
  <select id="idioma">
    <option value="" selected>No filtrar</option>
  </select><br>

  <label>Intérprete:</label>
  <select id="interprete">
    <option value="" selected>No filtrar</option>
  </select><br>

  <label>Estilo:</label>
  <select id="estilo">
    <option value="" selected>No filtrar</option>
  </select><br>

  <label>Buscar por texto:</label>
  <input type="text" id="textoBusqueda" placeholder="Buscar por título...">
  <button id="btnBuscar">Buscar</button>

  <div id="bloque_letra_audio">
	  <div id="bloque_letra"></div>
	  <div id="bloque_audio"></div>	  
  </div>
	
  <h3>Resultados:</h3>	
  <div id="resultados"></div>

  <script src="canciones.js"></script>

</body>
</html>
